name: Niquivan - Recordatorios diarios

on:
  schedule:
    # 7:00 AM hora Argentina (UTC-3) = 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install firebase-admin

      - name: Ejecutar recordatorios
        run: node scripts/daily-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          EMAILJS_TO_EMAIL_1: ${{ secrets.EMAILJS_TO_EMAIL_1 }}
          EMAILJS_TO_EMAIL_2: ${{ secrets.EMAILJS_TO_EMAIL_2 }}
